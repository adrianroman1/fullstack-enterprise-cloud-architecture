name: Enterprise CI/CD 2026

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        run: mvn -B package --file pom.xml -DskipTests # Build real

      - name: Run API & Selenium Tests
        run: |
          pip install selenium pytest requests
          pytest qa-automation/test_api_integrity.py
          # Selenium headless check

