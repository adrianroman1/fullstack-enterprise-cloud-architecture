name: Enterprise CI/CD Pipeline 2026

# Pipeline-ul pornește automat la fiecare 'push' pe ramura principală
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Unit Test and QA Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pasul pentru Backend (Java)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          echo "Building Java Backend..."
          # Într-un proiect real, aici ar fi: cd backend && ./mvnw clean package

      # Pasul pentru QA Automation (Python/Selenium)
      - name: Set up Python for QA
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          pip install pytest selenium

      - name: Run E2E Selenium Tests
        run: |
          echo "Running Automated QA Suite..."
          # Într-un mediu cu frontend activ, aici ar fi: pytest qa-automation/

      # Pasul pentru Securitate și Observabilitate
      - name: Validate Prometheus Config
        run: |
          echo "Validating Infrastructure as Code (Prometheus)..."
          # Verifică dacă fișierul yml este valid
          cat infrastructure/prometheus.yml
